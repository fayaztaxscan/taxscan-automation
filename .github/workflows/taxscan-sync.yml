name: Taxscan Automation

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Skip running between 12:00 AM and 5:00 AM IST
      # IST = Asia/Kolkata (UTC+5:30). This guard avoids cron timezone/30-min offset issues.
      - name: Skip midnight window (12–5 AM IST)
        shell: bash
        run: |
          HOUR_IST=$(TZ="Asia/Kolkata" date +%H)
          if [ "$HOUR_IST" -ge 0 ] && [ "$HOUR_IST" -lt 5 ]; then
            echo "Within 12–5 AM IST. Skipping run."
            exit 0
          fi
          echo "Outside skip window. Continuing."

      - name: Run automation
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONFIG_FILE: config.json

          # X (Twitter) OAuth 1.0a secrets
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

          # Facebook Page secrets (Shopscan first)
          FB_PAGE_ID_SHOPSCAN: ${{ secrets.FB_PAGE_ID_SHOPSCAN }}
          FB_PAGE_TOKEN_SHOPSCAN: ${{ secrets.FB_PAGE_TOKEN_SHOPSCAN }}

          # LinkedIn Page secrets
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
        run: |
          python main.py