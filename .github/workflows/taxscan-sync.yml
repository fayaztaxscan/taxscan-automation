name: Taxscan Automation

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:

# actions: write is needed by the "Keep schedule alive" step below.
permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GitHub disables cron schedules after 60 days with no commits to the repo, and
      # this repo only gets commits when something breaks. Re-enabling the workflow via
      # the API resets that 60-day clock, so do it on every scheduled run. Idempotent,
      # one API call, and it runs before the Python step so a failing run still counts.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable taxscan-sync.yml -R "$GITHUB_REPOSITORY"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Quiet hours: no social posting between 12:00 AM and 5:00 AM IST.
      # IST = Asia/Kolkata (UTC+5:30). Done in bash rather than cron because IST's
      # :30 offset makes cron windows awkward.
      #
      # The RSS -> sheet sync still runs during quiet hours. It must: feed_lookback_hours
      # is 6 and the window is 5 hours, so pausing the sync would leave ~1 hour of margin
      # and any delayed morning run would drop overnight articles permanently.
      #
      # NOTE: a bare `exit 0` here would only end THIS step, not the job - the previous
      # version did that and never actually skipped anything.
      - name: Check IST quiet window
        id: quiet
        shell: bash
        run: |
          HOUR_IST=$((10#$(TZ="Asia/Kolkata" date +%H)))
          if [ "$HOUR_IST" -ge 0 ] && [ "$HOUR_IST" -lt 5 ]; then
            echo "quiet=true" >> "$GITHUB_OUTPUT"
            echo "🌙 ${HOUR_IST}:00 IST is inside 12-5 AM quiet hours: feed sync only, no posting."
          else
            echo "quiet=false" >> "$GITHUB_OUTPUT"
            echo "☀️ ${HOUR_IST}:00 IST is outside quiet hours: posting enabled."
          fi

      - name: Run automation
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONFIG_FILE: config.json

          # "true" during 12-5 AM IST; main.py then runs the feed job only.
          SKIP_POSTING: ${{ steps.quiet.outputs.quiet }}

          # X (Twitter) OAuth 1.0a secrets
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

          # Facebook Page secrets (Shopscan first)
          FB_PAGE_ID_SHOPSCAN: ${{ secrets.FB_PAGE_ID_SHOPSCAN }}
          FB_PAGE_TOKEN_SHOPSCAN: ${{ secrets.FB_PAGE_TOKEN_SHOPSCAN }}

          # LinkedIn Page secrets
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
        run: |
          python main.py